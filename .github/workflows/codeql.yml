name: CodeQL

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    # Code scanning on a private repository needs GitHub Advanced Security. Skip (do not fail) until the
    # repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: [self-hosted, pc-builder]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL must see real compiler runs; cached or up-to-date tasks leave its database empty.
      - name: Compile (no tests)
        run: ./gradlew compileKotlin :examples:java:compileJava :examples:spring-boot:compileJava --rerun-tasks --no-build-cache --no-daemon --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:java-kotlin"

name: CodeQL

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    # Code scanning on a private repository needs GitHub Advanced Security. Skip (do not fail) until the
    # repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: [self-hosted, pc-builder]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL must see real compiler runs; cached or up-to-date tasks leave its database empty.
      - name: Compile (no tests)
        run: ./gradlew compileKotlin :examples:java:compileJava :examples:spring-boot:compileJava --rerun-tasks --no-build-cache --no-daemon --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:java-kotlin"
